# Nginx configuration snippet for optimized Google Drive uploads
# Add this to your nginx site configuration inside the 'server' block
# Location: /etc/nginx/sites-available/your-site.conf
# After adding, test with: sudo nginx -t
# Then reload: sudo systemctl reload nginx

# Increase timeouts to prevent 504 Gateway Timeout errors
proxy_connect_timeout 600s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
send_timeout 600s;

# FastCGI timeouts (if using PHP-FPM)
fastcgi_connect_timeout 600s;
fastcgi_send_timeout 600s;
fastcgi_read_timeout 600s;

# Allow large file uploads
client_max_body_size 6G;
client_body_timeout 600s;
client_header_timeout 600s;

# Buffering settings for large uploads
client_body_buffer_size 256k;
proxy_buffering off;
fastcgi_buffering off;

# Keep connections alive
keepalive_timeout 650s;

