; PHP-FPM configuration for optimized file uploads to Google Drive
; This file should be placed in your PHP-FPM conf.d directory
; Example locations:
; - /etc/php/8.x/fpm/conf.d/99-upload-optimization.ini
; - /usr/local/etc/php/conf.d/99-upload-optimization.ini
; After adding, restart PHP-FPM: sudo systemctl restart php8.x-fpm

[PHP]
; Execution time limits
max_execution_time = 600
max_input_time = 600
default_socket_timeout = 300

; Memory and upload limits
memory_limit = 512M
post_max_size = 6G
upload_max_filesize = 5G
max_file_uploads = 100

; Prevent premature connection closure
output_buffering = Off

; FastCGI timeout (if using FastCGI)
fastcgi.read_timeout = 600
